{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-green-900 to-slate-900 flex items-center justify-center px-4 py-12">
    <!-- Fondo animado decorativo -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-green-500/10 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl animate-pulse delay-1000"></div>
    </div>

    <!-- Contenedor principal -->
    <div class="relative z-10 w-full max-w-md">
        <!-- Card principal con efecto glassmorphism -->
        <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-8 shadow-2xl">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-green-400 to-green-600 rounded-xl mb-4 shadow-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Bienvenido</h1>
                <p class="text-gray-300 text-sm">Accede a tu cuenta para continuar</p>
            </div>

            <!-- Formulario de login tradicional -->
            <form action="{% url 'login' %}" method="post" class="space-y-5 mb-8">
                {% csrf_token %}

                <!-- Campo Usuario -->
                <div class="group">
                    <label for="username" class="block text-sm font-semibold text-gray-100 mb-2 transition">
                        <span class="flex items-center gap-2">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"></path>
                            </svg>
                            Usuario o Correo
                        </span>
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="w-full px-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-200 backdrop-blur-sm" 
                            placeholder="tu_usuario@correo.com"
                            required
                        >
                        <div class="absolute right-3 top-3 text-gray-400 group-focus-within:text-green-400 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="group">
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-sm font-semibold text-gray-100">
                            <span class="flex items-center gap-2">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
                                </svg>
                                Contraseña
                            </span>
                        </label>
                        <a href="#" class="text-xs text-green-400 hover:text-green-300 transition font-medium">
                            ¿Olvidaste?
                        </a>
                    </div>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="w-full px-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-200 backdrop-blur-sm" 
                            placeholder="••••••••"
                            required
                        >
                        <button 
                            type="button" 
                            class="absolute right-3 top-3 text-gray-400 hover:text-gray-300 transition"
                            onclick="togglePassword()"
                        >
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        name="remember" 
                        class="w-4 h-4 rounded border-white/20 bg-white/5 text-green-500 focus:ring-green-500 focus:ring-offset-0 cursor-pointer"
                    >
                    <label for="remember" class="ml-2 text-sm text-gray-300 cursor-pointer">
                        Recuérdame en este dispositivo
                    </label>
                </div>

                <!-- Botón de login principal -->
                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-3 rounded-lg transition duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 focus:ring-offset-transparent shadow-lg hover:shadow-green-500/50"
                >
                    <span class="flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                        </svg>
                        Iniciar Sesión
                    </span>
                </button>
            </form>

            <!-- Divisor -->
            <div class="relative mb-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/20"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white/10 text-gray-300">O continúa con</span>
                </div>
            </div>

            <!-- Botones de autenticación social -->
            <div class="grid grid-cols-3 gap-3 mb-6">
                <!-- Google -->
                <a 
                    href="/auth/google/" 
                    class="group relative flex items-center justify-center py-3 px-4 border border-white/20 rounded-lg bg-white/5 hover:bg-white/10 transition duration-200 hover:border-white/40 backdrop-blur-sm"
                    title="Continuar con Google"
                >
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <g fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </g>
                    </svg>
                    <span class="hidden group-hover:block absolute bottom-full mb-2 px-2 py-1 text-xs text-white bg-black/50 rounded whitespace-nowrap">Google</span>
                </a>

                <!-- GitHub -->
                <a 
                    href="/auth/github/" 
                    class="group relative flex items-center justify-center py-3 px-4 border border-white/20 rounded-lg bg-white/5 hover:bg-white/10 transition duration-200 hover:border-white/40 backdrop-blur-sm"
                    title="Continuar con GitHub"
                >
                    <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    <span class="hidden group-hover:block absolute bottom-full mb-2 px-2 py-1 text-xs text-white bg-black/50 rounded whitespace-nowrap">GitHub</span>
                </a>

                <!-- Microsoft -->
                <a 
                    href="/auth/microsoft/" 
                    class="group relative flex items-center justify-center py-3 px-4 border border-white/20 rounded-lg bg-white/5 hover:bg-white/10 transition duration-200 hover:border-white/40 backdrop-blur-sm"
                    title="Continuar con Microsoft"
                >
                    <svg class="w-6 h-6" viewBox="0 0 23 23" fill="none">
                        <rect x="0" y="0" width="10" height="10" fill="#F25022"/>
                        <rect x="13" y="0" width="10" height="10" fill="#7FBA00"/>
                        <rect x="0" y="13" width="10" height="10" fill="#00A4EF"/>
                        <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
                    </svg>
                    <span class="hidden group-hover:block absolute bottom-full mb-2 px-2 py-1 text-xs text-white bg-black/50 rounded whitespace-nowrap">Microsoft</span>
                </a>
            </div>

            <!-- Footer con enlace a registro -->
            <div class="text-center border-t border-white/20 pt-6">
                <p class="text-gray-300 text-sm">
                    ¿No tienes una cuenta?
                    <a 
                        href="#" 
                        class="font-semibold text-green-400 hover:text-green-300 transition duration-200 underline-offset-2 hover:underline"
                    >
                        Regístrate ahora
                    </a>
                </p>
                <p class="text-gray-500 text-xs mt-4">
                    Al continuar, aceptas nuestros
                    <a href="#" class="text-green-400 hover:text-green-300 transition">Términos de Servicio</a>
                    y
                    <a href="#" class="text-green-400 hover:text-green-300 transition">Política de Privacidad</a>
                </p>
            </div>
        </div>

        <!-- Enlace adicional debajo del card -->
        <div class="mt-6 text-center">
            <button 
                type="button"
                onclick="document.querySelector('html').style.opacity = '0.8'"
                class="text-gray-400 hover:text-gray-300 text-xs transition"
            >
                ¿Problemas técnicos? Contáctanos
            </button>
        </div>
    </div>
</div>

<!-- Script para toggle de contraseña -->
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-4.494m5.858.5a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>`;
        } else {
            passwordInput.type = 'password';
            eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
        }
    }
</script>

{% endblock %}
